<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إعادة تعيين كلمة المرور — الأندلس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; direction:rtl;
    background:linear-gradient(150deg,#EAF2FB,#F7FBFF); padding:20px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:24px; padding:40px 34px;
    box-shadow:0 24px 60px rgba(46,127,184,0.2); text-align:center; }
  .logo { font-size:22px; font-weight:700; color:#15385C; margin-bottom:6px; }
  .logo span { color:#C9A24B; }
  h1 { font-size:22px; color:#15385C; margin:14px 0 6px; }
  p.sub { font-size:13px; color:#8CA3BD; margin-bottom:24px; }
  label { display:block; text-align:right; font-size:12px; color:#5B7A9E; font-weight:700; margin-bottom:6px; }
  input { width:100%; padding:13px 14px; background:#F4F9FE; border:1.5px solid #DDE9F5; border-radius:14px;
    color:#15385C; font-size:14px; margin-bottom:16px; outline:none; }
  input:focus { border-color:#2E7FB8; }
  button { width:100%; padding:14px; border:none; border-radius:20px; color:#fff; font-weight:700; font-size:15px;
    cursor:pointer; background:linear-gradient(135deg,#1D5A8A,#2E7FB8 60%,#4FA3D9); box-shadow:0 8px 22px rgba(46,127,184,0.35); }
  button:disabled { background:#CBD5E1; cursor:not-allowed; box-shadow:none; }
  .msg { font-size:13px; font-weight:700; border-radius:14px; padding:12px 14px; margin-bottom:16px; line-height:1.7; }
  .ok { color:#059669; background:#10B98112; border:1px solid #10B98130; }
  .err { color:#EF4444; background:#EF444412; border:1px solid #EF444430; }
  a.back { display:inline-block; margin-top:18px; color:#2E7FB8; font-size:13px; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">مدارس الأندلس <span>الأهلية</span></div>
    <h1>إعادة تعيين كلمة المرور 🔑</h1>
    <p class="sub">أدخل كلمة المرور الجديدة لحسابك</p>
    <div id="msg"></div>
    <div id="form">
      <label>كلمة المرور الجديدة</label>
      <input type="password" id="np" placeholder="6 أحرف على الأقل">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="cp" placeholder="أعد كتابتها">
      <button id="btn" type="button">تعيين كلمة المرور</button>
    </div>
    <a class="back" href="/">← العودة لتسجيل الدخول</a>
  </div>
<script>
  // v108: ربط الأحداث عبر addEventListener (لا inline onclick) + بلا optional chaining
  //       كي يعمل الزرّ على كل المتصفّحات وتحت أصرم سياسات الأمان (CSP).
  (function () {
    function byId(id) { return document.getElementById(id); }
    var params = new URLSearchParams(location.search);
    var token = params.get('token');
    var msg = byId('msg');
    var form = byId('form');
    function show(type, text) { if (msg) { msg.className = 'msg ' + type; msg.textContent = text; } }
    if (!token) { show('err', 'رابط غير صالح — لا يوجد رمز.'); if (form) form.style.display = 'none'; return; }

    function submitReset() {
      var npEl = byId('np'), cpEl = byId('cp'), btn = byId('btn');
      var np = npEl ? npEl.value : '', cp = cpEl ? cpEl.value : '';
      if (np.length < 6) { show('err', 'كلمة المرور يجب ألا تقل عن 6 أحرف.'); return; }
      if (np !== cp) { show('err', 'تأكيد كلمة المرور غير مطابق.'); return; }
      if (btn) { btn.disabled = true; btn.textContent = 'جارٍ الحفظ...'; }
      fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, newPassword: np })
      }).then(function (r) {
        return r.json().then(function (data) { return { ok: r.ok, data: data }; });
      }).then(function (res) {
        if (res.ok && res.data && res.data.ok) {
          show('ok', '✓ تم تعيين كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.');
          if (form) form.style.display = 'none';
        } else {
          show('err', (res.data && res.data.error) || 'تعذّر إعادة التعيين. قد يكون الرابط منتهياً.');
          if (btn) { btn.disabled = false; btn.textContent = 'تعيين كلمة المرور'; }
        }
      }).catch(function () {
        show('err', 'خطأ في الاتصال. حاول مجدداً.');
        if (btn) { btn.disabled = false; btn.textContent = 'تعيين كلمة المرور'; }
      });
    }

    var btnEl = byId('btn');
    if (btnEl) btnEl.addEventListener('click', submitReset);
    var cpEl = byId('cp');
    if (cpEl) cpEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitReset(); });
  })();
</script>
</body>
</html>
